[orchestrator]
picks_dir = "data/picks"

[bluesky]
dm_recipient = "did:plc:your-did-here"

[scheduler]
early_lock_gap = 0.03
lineup_check_offset_min = 45
cluster_min = 10
doubleheader_recheck_min = 15
fallback_deadline_min = 35     # Force-post deadline if nothing confirmed by then
fallback_deadline_min_morning = 25  # Buffer for games starting before 11 AM ET (London Series, July 4)
morning_cutoff_hour = 11
missed_pick_alert_min = 10     # Alert threshold (minutes before first pitch) if no pick posted
results_poll_interval_min = 15
results_cap_hour_et = 5
default_init_hour_et = 10
early_game_buffer_min = 60

[scheduler.live_candidate_artifacts]
enabled = false
candidate = "decision_weighted_lgbm_v0"
worktree_dir = "/home/bts/projects/bts-live-forward"
command = "/home/bts/projects/bts-live-forward/.venv/bin/bts"
output_dir = "/home/bts/projects/bts/data/validation/{candidate}_live_forward/{date}"
data_dir = "/home/bts/projects/bts/data/processed"
top_n = 10
refresh_data = false
deterministic = true
random_state = 42
timeout_sec = 1800

[[tiers]]
name = "mac"
ssh_host = "mac"
bts_dir = "/Users/stone/projects/bts"
timeout_min = 5

[[tiers]]
name = "alienware"
ssh_host = "alienware"
bts_dir = "C:\\Users\\stone\\projects\\bts"
timeout_min = 10
platform = "windows"
