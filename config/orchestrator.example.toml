[orchestrator]
picks_dir = "data/picks"

[bluesky]
dm_recipient = "did:plc:your-did-here"

[scheduler]
pick_delivery = "public"      # public = Bluesky feed post, dm = private Bluesky DM, private = local only
early_lock_gap = 0.03
lineup_check_offset_min = 45
cluster_min = 10
doubleheader_recheck_min = 15
fallback_deadline_min = 35     # Force-post deadline if nothing confirmed by then
fallback_deadline_min_morning = 25  # Buffer for games starting before 11 AM ET (London Series, July 4)
morning_cutoff_hour = 11
missed_pick_alert_min = 10     # Alert threshold (minutes before first pitch) if no pick posted
results_poll_interval_min = 15
results_cap_hour_et = 5
default_init_hour_et = 10
early_game_buffer_min = 60
live_forward_capture_on_lock = true
live_forward_capture_unit = "bts-live-forward-capture.service"
live_forward_capture_artifact_root = "data/validation/decision_weighted_lgbm_v0_live_forward"
live_forward_capture_trigger_timeout_sec = 10
shadow_model = false
# After installing scripts/systemd/bts-shadow-prediction.service, set this to
# run shadow predictions outside the scheduler process:
# shadow_model_unit = "bts-shadow-prediction.service"
shadow_model_trigger_timeout_sec = 10

[health_checks]
enabled = true
pooled_dir = ""       # set to data/models_pooled only after pooled training is deployed
leaderboard_dir = ""  # set to data/leaderboard if leaderboard freshness is load-bearing

[[tiers]]
name = "mac"
ssh_host = "mac"
bts_dir = "/Users/stone/projects/bts"
timeout_min = 5

[[tiers]]
name = "alienware"
ssh_host = "alienware"
bts_dir = "C:\\Users\\stone\\projects\\bts"
timeout_min = 10
platform = "windows"
