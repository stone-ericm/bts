name: Deploy to Hetzner

# Triggers on pushes to `deploy` branch (not `main`).
# Workflow:
#   - Commit/push to `main` freely — no deploy side effect
#   - When ready to ship: `git push origin main:deploy` to trigger deploy
# Gives explicit human control over when the scheduler restart fires,
# avoiding disruption of live-game scorecard polling on every code push.

on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the test gate (emergency deploy only)"
        type: boolean
        default: false

# The workflow needs nothing from the GitHub token — deploy auth is the SSH
# secret. Least-privilege the token so a compromised earlier step can't use it
# (Codex review F11: all steps share the runner trust boundary).
permissions:
  contents: read

concurrency:
  group: deploy
  # Queue, never cancel (Codex round-2 R6): cancellation is applied at run
  # level BEFORE the job-level environment gate, so a mistaken main-branch
  # dispatch could kill an in-flight deploy mid-SSH — after the box changed
  # but before its canary/rollback — and only then fail the branch policy.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The root SSH key lives ONLY in this environment (rotated 2026-07-10;
    # audit could-not-verify item "secret scoping"). Its branch policy allows
    # just `deploy`, so no other workflow/branch can read the key — and a
    # workflow_dispatch MUST select the `deploy` branch or the run fails at
    # this gate by design.
    environment: production
    env:
      # uv.lock is generated in America/New_York (box + Mac); the date-only
      # exclude-newer resolves in local time, so a UTC runner shifts it and
      # `--locked` rejects the lockfile. Run the test gate in ET to match.
      TZ: America/New_York
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false  # no later step needs the git token (review #8)
          # Full history: tests/scripts/c2_framing/test_screen.py runs `git show`/`git diff`
          # against pinned commits (admission + stage-one identity); a depth-1 clone fails
          # with "bad object" (2026-10-21, run 39534775206). Pack is ~27 MB, 1750 commits.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          # Pin to the production box's uv so `--locked` interprets the
          # exclude-newer timestamp identically (newer uv shifted it 04:00Z->00:00Z
          # and rejected the lockfile). Bump alongside the box + uv.lock.
          version: "0.11.6"
          enable-cache: true

      # Gate the deploy on the fast test suite. Skipped only via a deliberate
      # workflow_dispatch with skip_tests=true (emergency deploy). (audit T1)
      - name: Test gate
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        run: |
          uv sync --locked --extra model
          uv run pytest -m "not slow"

      - name: Deploy via SSH with canary health checks
        id: deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        env:
          TARGET_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: TARGET_SHA,RUN_ID,RUN_ATTEMPT
          command_timeout: 20m
          script: |
            exec /bin/bash -s <<'BTS_DEPLOY'
            set +e
            exec 8>&1
            export LC_ALL=C
            checkout=/home/bts/projects/bts
            lock_dir=/run/bts-deploy
            attempt=$lock_dir/attempt
            scheduler=bts-scheduler.service
            dashboard=bts-dashboard.service
            legacy_dir=/etc/systemd/system
            old=unknown
            staged=
            budget_start=
            reported=
            phase_steps='commit-record|disable|reset|sync|legacy-units|restart|head|wait|scheduler-state|dashboard-state|dashboard-http|contest-state|stamp-stage|enable|stamp|interrupted|deploy-step-incomplete'

            # Test injection points are the fixed checkout, bts home, runtime and legacy
            # directories, cgroup root, null device, and fixed executable paths at use.
            fs_code='
            import datetime, json, os, pathlib, signal, stat, subprocess, sys, tempfile, time
            from urllib.parse import urlsplit

            op, *args = sys.argv[1:]
            def bounded(path, limit, nofollow=True):
                flags = os.O_RDONLY | os.O_NONBLOCK
                if nofollow:
                    flags |= os.O_NOFOLLOW
                fd = os.open(path, flags)
                with os.fdopen(fd, "rb") as f:
                    metadata = os.fstat(f.fileno())
                    if not stat.S_ISREG(metadata.st_mode):
                        raise ValueError()
                    data = f.read(limit + 1)
                    if len(data) > limit or not os.path.samestat(metadata, os.stat(path, follow_symlinks=False)):
                        raise ValueError()
                    return data, metadata

            def atomic(path, data):
                fd, temporary = tempfile.mkstemp(dir=os.path.dirname(path))
                try:
                    with os.fdopen(fd, "wb") as f:
                        f.write(data)
                    os.replace(temporary, path)
                finally:
                    if os.path.lexists(temporary):
                        os.unlink(temporary)

            try:
                if op == "clock":
                    print(time.monotonic_ns() // 1_000_000)
                elif op == "supervise":
                    term, grace, *command = args
                    # This process retains the inherited lock while the command runs.
                    for sig in (signal.SIGHUP, signal.SIGINT, signal.SIGTERM, signal.SIGPIPE):
                        signal.signal(sig, lambda *_: None)
                    child = subprocess.Popen(["timeout", "-k", grace, term, *command],
                                             start_new_session=True, close_fds=True)
                    try:
                        status = child.wait(timeout=float(term) + float(grace))
                    except subprocess.TimeoutExpired:
                        status = 124
                    if status in (124, 137) or status < 0:
                        try:
                            os.killpg(child.pid, signal.SIGKILL)
                        except ProcessLookupError:
                            pass
                    if child.poll() is None:
                        try:
                            child.wait(timeout=0.1)
                        except subprocess.TimeoutExpired:
                            pass
                    sys.exit(128 - status if status < 0 else status)
                elif op in ("capture", "capture-contest"):
                    limit, *command = args
                    with subprocess.Popen(command, stdout=subprocess.PIPE) as child:
                        data = child.stdout.read(int(limit) + 1)
                        if len(data) > int(limit):
                            child.kill()
                            sys.exit(125)
                        status = child.wait()
                    if op == "capture":
                        sys.stdout.buffer.write(data)
                    else:
                        line = data.removesuffix(b"\n")
                        prefixes = {
                            0: (b"Deploy canary: live contest state accepted (",
                                b"Deploy canary: not a live configuration (delivery "),
                            1: ("Deploy canary: REFUSED — ".encode(),),
                            2: ("Deploy canary: ERROR — ".encode(),),
                        }
                        if not any(byte in line for byte in (b"\0", b"\n", b"\r")) and line.startswith(prefixes.get(status, ())):
                            text = line.decode("utf-8", errors="backslashreplace")
                            print("".join(c if c.isprintable() else ascii(c)[1:-1] for c in text)[:900])
                    sys.exit(128 - status if status < 0 else status)
                elif op == "lockfile":
                    p, = args
                    fd = os.open(p, os.O_WRONLY | os.O_APPEND | os.O_CREAT | os.O_NOFOLLOW | os.O_NONBLOCK, 0o600)
                    with os.fdopen(fd, "ab") as f:
                        s = os.fstat(f.fileno())
                        if not stat.S_ISREG(s.st_mode) or s.st_uid != 0 or stat.S_IMODE(s.st_mode) != 0o600:
                            raise ValueError()
                elif op == "read":
                    p, = args
                    data, _ = bounded(p, 512)
                    if not data.endswith(b"\n") or any(c < 32 or c > 126 for c in data[:-1]):
                        raise ValueError()
                    print(data[:-1].decode("ascii"))
                elif op == "mark":
                    p, = args
                    try:
                        fd = os.open(p, os.O_CREAT | os.O_EXCL | os.O_WRONLY | os.O_NOFOLLOW, 0o600)
                    except FileExistsError:
                        pass
                    else:
                        os.close(fd)
                    data, s = bounded(p, 0)
                    if s.st_uid != 0 or stat.S_IMODE(s.st_mode) != 0o600:
                        raise ValueError()
                elif op == "stage-record":
                    directory, line = args
                    fd, name = tempfile.mkstemp(dir=directory, prefix=".attempt.")
                    try:
                        with os.fdopen(fd, "wb") as f:
                            f.write(line.encode("ascii") + b"\n")
                    except BaseException:
                        os.unlink(name)
                        raise
                    print(name)
                elif op == "stage":
                    directory, = args
                    with tempfile.NamedTemporaryFile(dir=directory, prefix=".deploy.", delete=False) as f:
                        try:
                            f.write(datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ\n").encode("ascii"))
                            f.flush()
                            os.fsync(f.fileno())
                        except BaseException:
                            os.unlink(f.name)
                            raise
                    print(f.name)
                elif op == "stamp":
                    source, path = args
                    if os.path.isdir(path):
                        raise ValueError()
                    os.replace(source, path)
                    fd = os.open(os.path.dirname(path), os.O_RDONLY | os.O_DIRECTORY)
                    try:
                        os.fsync(fd)
                    finally:
                        os.close(fd)
                elif op == "marker":
                    path, step, target, old = args
                    data = json.dumps(dict(state="deploy_failed", timestamp=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                                           step=step, target_sha=target, old_sha=old)).encode()
                    atomic(path, data)
                    if bounded(path, 4096)[0] != data:
                        raise ValueError()
                elif op == "endpoint":
                    path, = args
                    prefix = "BTS_SCHEDULER_HEARTBEAT_PING_URL="
                    lines = bounded(path, 65536)[0].decode().split("\n")
                    value, = [line[len(prefix):] for line in lines if line.startswith(prefix)]
                    if len(value) >= 2 and value[0] in (chr(34), chr(39)) and value[-1] == value[0]:
                        value = value[1:-1]
                    if any(c.isspace() or not c.isprintable() or c in (chr(34), chr(39), "\\", "?", "#", "{", "}", "[", "]") for c in value):
                        raise ValueError()
                    parsed = urlsplit(value)
                    if parsed.scheme != "https" or not parsed.hostname or parsed.username is not None or parsed.password is not None:
                        raise ValueError()
                    if parsed.netloc.endswith(":"):
                        raise ValueError()
                    # A dot segment or an escape could make the request reach another check.
                    if "%" in value or any(part in (".", "..") for part in parsed.path.split("/")):
                        raise ValueError()
                    parsed.port
                    print(value.rstrip("/") + "/fail")
                elif op == "cgroup":
                    root, group = args
                    if not os.path.isfile(os.path.join(root, "cgroup.controllers")):
                        raise ValueError()
                    if group:
                        if not group.startswith("/") or ".." in pathlib.PurePosixPath(group).parts:
                            raise ValueError()
                        path = root + group
                        try:
                            events, _ = bounded(os.path.join(path, "cgroup.events"), 4096)
                        except FileNotFoundError:
                            if os.path.lexists(path):
                                raise
                        else:
                            if [line for line in events.splitlines() if line.startswith(b"populated ")] != [b"populated 0"]:
                                raise ValueError()
            except FileNotFoundError:
                sys.exit(3 if op == "read" and not os.path.lexists(args[0]) else 1)
            except Exception:
                sys.exit(1)
            '

            clock() {
                (exec 9>&- 8>&-; timeout -k 5 1 /usr/bin/python3 -c "$fs_code" clock) 2>/dev/null
            }
            start_phase() {
                local now
                now=$(clock)
                [[ $now =~ ^[0-9]+$ ]] || return 1
                deadline=$((now + $1 * 1000))
            }
            run() {
                local cap=$1 grace=$2 mode=$3 now available term
                shift 3
                if [[ -n ${budget_start:-} ]]; then
                    now=$((budget_origin + (SECONDS - budget_start) * 1000))
                else
                    now=$(clock)
                    [[ $now =~ ^[0-9]+$ ]] || return 124
                fi
                available=$(((deadline - now) / 1000))
                # Bash SECONDS counts whole seconds: allow one for rounding.
                [[ -z ${budget_start:-} ]] || available=$((available - 1))
                if [[ $mode == wait ]] && (( available < cap )); then
                    return 124
                fi
                (( available < cap )) && cap=$available
                term=$((cap - grace))
                (( term > 0 )) || return 124
                case $mode in
                    mutation)
                        /usr/bin/python3 -c "$fs_code" supervise "$term" "$grace" "$@" ;;
                    lock)
                        (exec 8>&-; timeout -k "$grace" "$term" "$@") ;;
                    *)
                        (exec 9>&- 8>&-; timeout -k "$grace" "$term" "$@") ;;
                esac </dev/null 2>/dev/null
            }
            log() {
                (exec 9>&- 8>&-; timeout -k 5 1 /bin/bash -c 'printf "%s\n" "$@"' _ "$@") >&8 2>/dev/null || :
            }
            fs() {
                local cap=$1 mode=$2
                shift 2
                run "$cap" 5 "$mode" /usr/bin/python3 -c "$fs_code" "$@"
            }
            as_user() {
                local cap=$1 mode=$2
                shift 2
                if [[ $uid =~ ^[0-9]+$ ]]; then
                    run "$cap" 5 "$mode" sudo -u bts "XDG_RUNTIME_DIR=/run/user/$uid" systemctl --user "$@"
                else
                    run "$cap" 5 "$mode" sudo -u bts systemctl --user "$@"
                fi
            }
            as_bts() {
                local cap=$1 mode=$2
                shift 2
                run "$cap" 5 "$mode" sudo -Hu bts "$@"
            }
            valid_inputs() {
                [[ $TARGET_SHA =~ ^[0-9a-f]{40}$ ]] || return 1
                [[ $RUN_ID =~ ^[0-9]{1,20}$ && $RUN_ATTEMPT =~ ^[0-9]{1,20}$ &&
                   $RUN_ID =~ [1-9] && $RUN_ATTEMPT =~ [1-9] ]] || return 2
            }
            lock() {
                local metadata
                [[ ! -L $lock_dir ]] || return 1
                if [[ ! -e $lock_dir ]]; then
                    run 10 5 normal install -d -m 0700 -o root -g root "$lock_dir" >/dev/null || return 1
                fi
                [[ -d $lock_dir && ! -L $lock_dir && ! -L $lock_dir/lock ]] || return 1
                metadata=$(run 10 5 normal stat -c '%u %a' "$lock_dir") || return 1
                [[ $metadata == '0 700' ]] || return 1
                [[ ! -e $lock_dir/lock || -f $lock_dir/lock ]] || return 1
                fs 10 normal lockfile "$lock_dir/lock" || return 1
                { exec 9>>"$lock_dir/lock"; } 2>/dev/null || return 1
                if [[ $1 == deploy ]]; then
                    run 10 5 lock flock -n 9
                else
                    run 1505 5 lock flock -w 1500 9
                fi
            }
            read_record() {
                local record cap=${1:-10}
                record=$(fs "$cap" normal read "$attempt")
                local rc=$?
                (( rc == 0 )) || return "$rc"
                local grammar="^bts_deploy_attempt_v1 ([0-9]{1,20}) ([0-9]{1,20}) ([0-9a-f]{40}) ([0-9a-f]{40}) (begun|committed|contained) ([a-z-]+) (-|verified|unverified) (-|verified|unverified) (-|verified|unverified)$"
                [[ $record =~ $grammar ]] || return 1
                r_run=${BASH_REMATCH[1]} r_try=${BASH_REMATCH[2]} r_target=${BASH_REMATCH[3]} r_old=${BASH_REMATCH[4]}
                r_state=${BASH_REMATCH[5]} r_step=${BASH_REMATCH[6]}
                r_stop=${BASH_REMATCH[7]} r_marker=${BASH_REMATCH[8]} r_page=${BASH_REMATCH[9]}
                [[ $r_run =~ [1-9] && $r_try =~ [1-9] ]] || return 1
                if [[ $r_state == contained ]]; then
                    [[ $r_step =~ ^($phase_steps)$ && $r_stop != - && $r_marker != - && $r_page != - ]]
                else
                    [[ $r_step == - && $r_stop$r_marker$r_page == --- ]]
                fi
            }
            same_ids() { [[ $r_run == "$RUN_ID" && $r_try == "$RUN_ATTEMPT" ]]; }
            same_record() { same_ids && [[ $r_target == "$TARGET_SHA" && $r_old == "$old" ]]; }
            publish() {
                local wanted=$1 staged_record status rc
                shift
                staged_record=$(fs 10 mutation stage-record "$lock_dir" "bts_deploy_attempt_v1 $RUN_ID $RUN_ATTEMPT $TARGET_SHA $old $wanted $*")
                status=$?
                if (( status == 0 )); then
                    if [[ $staged_record == "$lock_dir/.attempt."* ]]; then
                        run 10 5 mutation mv -fT "$staged_record" "$attempt" >/dev/null
                        status=$?
                        if [[ -e $staged_record ]]; then
                            run 10 5 mutation rm -f -- "$staged_record" >/dev/null || :
                        fi
                    else
                        status=1
                    fi
                fi
                read_record
                rc=$?
                if (( rc == 0 )) && same_record && [[ $r_state == "$wanted" && "$r_step $r_stop $r_marker $r_page" == "$*" ]]; then
                    return 0
                fi
                if [[ $wanted == committed ]]; then
                    case $status:$rc in
                        124:*|137:*|*:124|*:137) return 124 ;;
                    esac
                    (( status == 0 )) || return "$status"
                    # A failed read-back after a successful rename keeps its own status.
                    (( rc == 0 || rc == 3 )) || return "$rc"
                fi
                if (( rc != 0 && rc != 3 )); then
                    return 2
                fi
                return 1
            }
            field() {
                local key=$1 contents=$2 allow_empty=${3:-no} line result= count=0
                while IFS= read -r line; do
                    if [[ $line == "$key="* ]]; then
                        result=${line#*=}
                        (( count += 1 ))
                    fi
                done <<< "$contents"
                [[ $count == 1 && ( -n $result || $allow_empty == yes ) ]] || return 1
                printf '%s' "$result"
            }
            enabled() {
                local expected=$1 cap=$2 output rc
                shift 2
                output=$("$@" "$cap" normal is-enabled "$unit"; rc=$?; printf '\037'; exit "$rc")
                rc=$?
                [[ $rc != 124 && $rc != 137 ]] || return "$rc"
                if [[ $expected == disabled ]]; then
                    [[ $rc == 1 && $output == $'disabled\n\037' ]]
                else
                    [[ $rc == 0 && $output == $'enabled\n\037' ]]
                fi
            }
            system_unit() {
                local cap=$1 mode=$2
                shift 2
                run "$cap" 5 "$mode" systemctl "$@"
            }
            jobs_clear() {
                local command=$1 cap=$2 name=$3 jobs job id rest
                jobs=$("$command" "$cap" normal list-jobs --no-legend --no-pager) || return 1
                while read -r id job rest; do
                    [[ -z $id || ( $id =~ ^[0-9]+$ && -n $job && -n $rest && $job != "$name" ) ]] || return 1
                done <<< "$jobs"
            }
            legacy_state() {
                local cap=$1 name=$2 output id active pid
                output=$(system_unit "$cap" normal show "$name" -p Id -p LoadState -p ActiveState -p MainPID) || return 1
                id=$(field Id "$output") && [[ $id == "$name" ]] || return 1
                active=$(field ActiveState "$output") || return 1
                pid=$(field MainPID "$output") && [[ $pid =~ ^[0-9]+$ ]] || return 1
                legacy=$(field LoadState "$output") || return 1
                case $active in active|inactive|failed|activating|deactivating|reloading) ;; *) return 1 ;; esac
                case $legacy in
                    loaded) ;;
                    not-found) [[ $active == inactive && $pid == 0 ]] || return 1 ;;
                    *) return 1 ;;
                esac
                jobs_clear system_unit "$cap" "$name"
            }
            no_fragment() { [[ ! -e $legacy_dir/$scheduler && ! -L $legacy_dir/$scheduler ]]; }
            # Phase 2 marks an attempt before it stops and unloads a loaded legacy scheduler. After that
            # its absence proves nothing about the cgroup it left, so no containment of the attempt accepts it.
            legacy_cleaned() { [[ -e $lock_dir/legacy.$RUN_ID.$RUN_ATTEMPT || -L $lock_dir/legacy.$RUN_ID.$RUN_ATTEMPT ]]; }
            scheduler_group() {
                local output
                output=$("$1" 10 normal show "$2" -p ControlGroup) || return 1
                # A successful blank value is an observation; only a failed query returns non-zero.
                field ControlGroup "$output" yes
            }
            check_stopped() {
                local command=$1 name=$2 previous_group=$3 output active pid group
                output=$("$command" 20 normal show "$name" -p ActiveState -p MainPID -p ControlGroup) || return 1
                active=$(field ActiveState "$output") && [[ $active == inactive || $active == failed ]] || return 1
                pid=$(field MainPID "$output") && [[ $pid == 0 ]] || return 1
                group=$(field ControlGroup "$output" yes) || return 1
                jobs_clear "$command" 20 "$scheduler" || return 1
                [[ -n $previous_group || -n $group ]] || return 1
                if [[ -n $previous_group && $previous_group != "$group" ]]; then
                    fs 20 normal cgroup /sys/fs/cgroup "$previous_group" || return 1
                fi
                [[ -z $group ]] || fs 20 normal cgroup /sys/fs/cgroup "$group"
            }
            # The one proof function (D3 amendment 4, M1): the only code that makes a
            # result "verified" and the only printer of the containment results. Each
            # result starts unverified and becomes verified only from an observation
            # made by this containment (the page also from this attempt's own record).
            prove() {
                case $1 in
                    stop)
                        local user_proof=1 system_proof=1 residual legacy_ok=1 post_group
                        stop=unverified
                        # Proof queries: to 205 s of the handler's 280 s.
                        deadline=$((containment_deadline - 75000))
                        if (( uid_status == 0 && user_group_status == 0 )) && [[ $uid =~ ^[0-9]+$ ]]; then
                            unit=bts-scheduler
                            if enabled disabled 20 as_user && check_stopped as_user "$unit" "$user_group"; then
                                user_proof=0
                            fi
                        fi
                        if legacy_state 20 "$scheduler"; then
                            unit=$scheduler
                            if [[ $legacy == not-found ]] && no_fragment; then
                                if ! legacy_cleaned && post_group=$(scheduler_group system_unit "$scheduler"); then
                                    if [[ $legacy_absent == 0 ]]; then
                                        # Absent at the containment's first sample: no path needed, any reported one checked.
                                        system_proof=0
                                    elif (( legacy_group_status == 0 )) && [[ -n $legacy_group || -n $post_group ]]; then
                                        # Seen loaded, or not seen absent: at least one path known.
                                        system_proof=0
                                    fi
                                    # Every known path must be empty or absent.
                                    [[ -z $legacy_group ]] || fs 20 normal cgroup /sys/fs/cgroup "$legacy_group" || system_proof=1
                                    [[ -z $post_group || $post_group == "$legacy_group" ]] ||
                                        fs 20 normal cgroup /sys/fs/cgroup "$post_group" || system_proof=1
                                fi
                            elif [[ $legacy == loaded ]] && (( legacy_group_status == 0 )) &&
                                 check_stopped system_unit "$scheduler" "$legacy_group" && enabled disabled 20 system_unit; then
                                system_proof=0
                            fi
                        fi
                        if (( system_proof == 0 )) && [[ $legacy_absent == 0 || $legacy_disabled$legacy_stopped == 00 ]]; then
                            legacy_ok=0
                        fi
                        # The residual check's own window, 205 to 220 s: no proof query above runs past 205 s,
                        # and it is launched whatever the proof found.
                        deadline=$((containment_deadline - 60000))
                        run 20 5 normal pgrep -u bts -f 'bts schedule' >/dev/null; residual=$?
                        if [[ $user_disabled$user_stopped$user_proof$legacy_ok$residual == 00001 ]]; then
                            stop=verified
                        fi
                        ;;
                    marker)
                        marker=unverified
                        [[ $2 == 0 ]] && marker=verified
                        ;;
                    page)
                        page=unverified
                        if [[ $2 == carried ]] || [[ $2 == 0 && $3 =~ ^2[0-9][0-9]$ ]]; then
                            page=verified
                        fi
                        ;;
                    report)
                        # One bounded print with a short grace: the last two seconds of the handler.
                        local lines=("Scheduler stopped: $stop." "Failure heartbeat written: $marker."
                                     "Failure ping received HTTP 2xx: $page." "Recovery procedure: INCIDENT.md §4.")
                        if [[ $repeat == yes && $stop$marker$page == verifiedverifiedverified ]]; then
                            lines+=('DEPLOY RECOVERY — containment re-checked.')
                        fi
                        (exec 9>&- 8>&-; timeout -k 1 1 /bin/bash -c 'printf "%s\n" "$@"' _ "${lines[@]}") >&8 2>/dev/null || :
                        ;;
                esac
            }
            contain() {
                trap '' HUP INT TERM PIPE
                local step=$1 status=$2 prior_page=$3 repeat=$4
                local stop=unverified marker=unverified page=unverified uid unit
                local user_disabled=1 user_stopped=1 legacy_disabled=1 legacy_stopped=1 legacy_absent=1
                local deadline containment_deadline output endpoint user_group legacy_group= post_status
                local user_group_status=1 legacy_group_status=1 legacy_first=1
                local budget_start=$SECONDS budget_origin
                # One sample anchors the handler's separate budget. Bash SECONDS also
                # keeps that budget running when the external clock cannot be sampled.
                budget_origin=$(clock)
                [[ $budget_origin =~ ^[0-9]+$ ]] || budget_origin=0
                containment_deadline=$((budget_origin + 280000))
                if [[ $repeat != yes ]]; then
                    log "DEPLOY FAILED at $step — requested target ${TARGET_SHA:0:7}, previous SHA ${old:0:7}. No automatic rollback was attempted. Recovery has not been verified."
                    [[ $reported == "$step" ]] || log "Check $step failed ($status)."
                fi
                # User scope stop: to 90 s.
                deadline=$((containment_deadline - 190000))
                uid=$(run 10 5 normal id -u bts)
                local uid_status=$?
                if (( uid_status != 0 )) || [[ ! $uid =~ ^[0-9]+$ ]]; then
                    uid=
                fi
                user_group=$(scheduler_group as_user bts-scheduler); user_group_status=$?
                as_user 10 mutation disable bts-scheduler >/dev/null; user_disabled=$?
                as_user 60 mutation stop bts-scheduler >/dev/null; user_stopped=$?
                # Legacy scope stop: to 180 s.
                deadline=$((containment_deadline - 100000))
                legacy_state 10 "$scheduler"; legacy_first=$?
                legacy_group=$(scheduler_group system_unit "$scheduler"); legacy_group_status=$?
                if (( legacy_first == 0 && legacy_group_status == 0 )) && [[ $legacy == not-found && -z $legacy_group ]] &&
                   no_fragment && ! legacy_cleaned; then
                    # Absent: not-found, inactive, PID 0, no jobs, no cgroup and no fragment entry.
                    legacy_absent=0
                else
                    system_unit 10 mutation disable "$scheduler" >/dev/null; legacy_disabled=$?
                    system_unit 60 mutation stop "$scheduler" >/dev/null; legacy_stopped=$?
                fi
                prove stop
                # Marker: to 240 s, before the optional staged-file cleanup.
                deadline=$((containment_deadline - 40000))
                as_bts 20 mutation /usr/bin/python3 -c "$fs_code" marker "$checkout/data/.heartbeat" "$step" "${TARGET_SHA:0:7}" "${old:0:7}" >/dev/null
                prove marker "$?"
                if [[ $staged == "$checkout/data/.deploy."* ]]; then
                    as_bts 10 mutation rm -f -- "$staged" >/dev/null || :
                fi
                # Endpoint parsing to 254 s, so a valid URL leaves curl at least 10 s of TERM before 270 s.
                deadline=$((containment_deadline - 26000))
                if [[ $prior_page == verified ]]; then
                    prove page carried
                elif endpoint=$(as_bts 20 normal /usr/bin/python3 -c "$fs_code" endpoint "$checkout/.env"); then
                    deadline=$((containment_deadline - 10000))
                    output=$(run 20 5 normal curl --disable --globoff --path-as-is --noproxy '*' -sS -m 10 -o /dev/null -w '%{http_code}' \
                        --data-raw "Deploy failed at $step, requested target ${TARGET_SHA:0:7}, scheduler stop $stop. See INCIDENT.md §4." "$endpoint"
                        local status=$?; printf '\037'; exit "$status")
                    post_status=$?
                    prove page "$post_status" "${output%$'\037'}"
                else
                    prove page none
                fi
                # The record to 278 s; the last two seconds are for the result lines.
                deadline=$((containment_deadline - 2000))
                publish contained "$step" "$stop" "$marker" "$page" || :
                exec 9>&-
                prove report
                exit 1
            }

            not_started() {
                exec 9>&-
                log "DEPLOY NOT STARTED — $1 failed. This deploy invocation did not change the checkout or services. Previous SHA: ${old:0:7}."
                exit 1
            }
            unknown_begin() {
                exec 9>&-
                log 'DEPLOY NOT STARTED — attempt-record failed. This deploy invocation did not change the checkout or services. Recovery has not been verified.'
                exit 1
            }
            # The signal handler's one decision (D3 amendment 4, M3, rows S1 to S9).
            # It sets answer to success, not-started or contain.
            signal_rule() {
                answer=contain
                case $publication in
                    committed) answer=success; return ;;                      # S1
                    beginning|committing) ;;
                    *) return ;;                                              # S2; an unknown value contains
                esac
                # A rename may have completed before its caller observed the result.
                local budget_start=$SECONDS budget_origin=0 deadline=15000 rc
                read_record 15
                rc=$?
                if [[ $publication == committing ]]; then
                    if (( rc == 0 )) && same_record && [[ $r_state == committed ]]; then
                        answer=success                                        # S3; else S4
                    fi
                elif (( rc == 3 )) || { (( rc == 0 )) && ! same_ids; }; then
                    answer=not-started                                        # S5, S6
                fi                                                            # else S7, S8, S9
            }
            on_signal() {
                trap '' HUP INT TERM PIPE
                local answer
                signal_rule
                case $answer in
                    success) exec 9>&-; exit 0 ;;
                    not-started) not_started attempt-record ;;
                    *) contain interrupted 130 ;;
                esac
            }
            step_status() {
                local step=$1 status=$2
                case $status in 124|137) status=timeout ;; esac
                (( $2 == 0 )) || contain "$step" "$status"
            }
            check() {
                local step=$1 status=$2
                [[ $status == 0 ]] && return
                case $status in 124|137) status=timeout ;; esac
                log "Check $step failed ($status)."
                if [[ -z $reported ]]; then
                    reported=$step
                    first_status=$status
                fi
            }
            query_status() {
                case $1 in 124|137) printf timeout ;; *) printf query ;; esac
            }

            valid_inputs
            case $? in 1) not_started target ;; 2) not_started attempt-id ;; esac
            start_phase 75 || not_started cd
            cd "$checkout" 2>/dev/null || not_started cd
            lock deploy || not_started lock
            cancel=$lock_dir/cancelled.$RUN_ID.$RUN_ATTEMPT
            [[ ! -L $cancel && ! -e $cancel ]] || not_started cancelled
            read_record
            case $? in
                0) if same_ids; then not_started attempt-record; fi ;;
                3) ;;
                *) not_started attempt-record ;;
            esac
            uid=$(run 10 5 normal id -u bts) && [[ $uid =~ ^[0-9]+$ ]] || not_started uid
            head=$(as_bts 10 normal git rev-parse HEAD) && [[ $head =~ ^[0-9a-f]{40}$ ]] || not_started old-sha
            old=$head
            log "Pre-deploy SHA: ${old:0:7}"
            as_bts 10 mutation git config --global --add safe.directory "$checkout" >/dev/null || not_started git-config
            as_bts 45 mutation git fetch origin >/dev/null || not_started fetch
            object=$(as_bts 10 normal git cat-file -t "$TARGET_SHA") && [[ $object == commit ]] || not_started target
            services=$(as_user 10 normal show bts-scheduler -p LoadState -p UnitFileState) || not_started user-units
            loaded=$(field LoadState "$services") && [[ $loaded == loaded ]] || not_started user-units
            unit_file=$(field UnitFileState "$services") && [[ $unit_file == enabled || $unit_file == disabled ]] || not_started user-units
            services=$(as_user 10 normal show bts-dashboard -p LoadState) || not_started user-units
            loaded=$(field LoadState "$services") && [[ $loaded == loaded ]] || not_started user-units
            legacy_names=()
            for name in "$scheduler" "$dashboard"; do
                legacy_state 10 "$name" || not_started legacy-units
                [[ $legacy != loaded ]] || legacy_names+=("$name")
            done

            start_phase 800 || not_started attempt-record
            publication=beginning
            trap on_signal HUP INT TERM PIPE
            publish begun - - - -
            case $? in 1) not_started attempt-record ;; 2) unknown_begin ;; esac
            publication=begun
            as_user 20 mutation disable bts-scheduler >/dev/null
            step_status disable "$?"
            unit=bts-scheduler
            enabled disabled 20 as_user
            step_status disable "$?"
            as_bts 45 mutation git reset --hard "$TARGET_SHA" >/dev/null
            step_status reset "$?"
            as_bts 480 mutation env UV_CACHE_DIR=/tmp/uv-cache UV_PROJECT_ENVIRONMENT="$checkout/.venv" /home/bts/.local/bin/uv sync --locked --extra model >/dev/null
            step_status sync "$?"
            if (( ${#legacy_names[@]} )); then
                for name in "${legacy_names[@]}"; do
                    if [[ $name == "$scheduler" ]]; then
                        fs 10 mutation mark "$lock_dir/legacy.$RUN_ID.$RUN_ATTEMPT" >/dev/null
                        step_status legacy-units "$?"
                    fi
                    system_unit 20 mutation disable "$name" >/dev/null
                    step_status legacy-units "$?"
                    system_unit 20 mutation stop "$name" >/dev/null
                    step_status legacy-units "$?"
                    run 20 5 mutation rm -f "$legacy_dir/$name" >/dev/null
                    step_status legacy-units "$?"
                done
                system_unit 20 mutation daemon-reload >/dev/null
                step_status legacy-units "$?"
                run 20 5 mutation pkill -u bts -f 'uv run bts schedule' >/dev/null
                rc=$?
                (( rc == 1 )) || step_status legacy-units "$rc"
            fi
            as_user 75 mutation restart bts-scheduler bts-dashboard >/dev/null
            step_status restart "$?"
            head=$(as_bts 10 normal git rev-parse HEAD)
            step_status head "$?"
            [[ $head == "$TARGET_SHA" ]] || contain head query
            log "Checking requested target ${TARGET_SHA:0:7}." 'Waiting 30s for services to stabilize...'
            run 35 2 wait sleep 30 >/dev/null
            step_status wait "$?"

            services=$(as_user 20 normal show bts-scheduler -p ActiveState -p SubState -p Result -p ExecMainStatus)
            rc=$?
            if (( rc )); then
                check scheduler-state "$(query_status "$rc")"
            elif active=$(field ActiveState "$services") && sub=$(field SubState "$services") &&
                 result=$(field Result "$services") && status=$(field ExecMainStatus "$services") &&
                 [[ $active =~ ^[a-z-]+$ && $sub =~ ^[a-z-]+$ && $result =~ ^[a-z-]+$ && $status =~ ^[0-9]+$ ]]; then
                if [[ $active != active ]]; then
                    if [[ $active == activating && $sub == auto-restart && $result == success && $status == 0 ]]; then
                        log 'bts-scheduler.service completed cleanly and is waiting for relaunch'
                    else
                        check scheduler-state 1
                    fi
                fi
            else
                check scheduler-state query
            fi

            services=$(as_user 20 normal show bts-dashboard -p ActiveState)
            rc=$?
            if (( rc )); then
                check dashboard-state "$(query_status "$rc")"
            elif active=$(field ActiveState "$services") && [[ $active =~ ^[a-z-]+$ ]]; then
                [[ $active == active ]] || check dashboard-state 1
            else
                check dashboard-state query
            fi

            address=$(run 20 5 normal /usr/bin/python3 -c "$fs_code" capture 4096 sudo -u bts tailscale ip -4)
            rc=$?
            address=${address%%$'\n'*}
            host=127.0.0.1
            if (( rc == 0 )) && [[ $address =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
                IFS=. read -r a b c d <<< "$address"
                if (( 10#$a <= 255 && 10#$b <= 255 && 10#$c <= 255 && 10#$d <= 255 )); then
                    host=$address
                fi
            fi
            code=$(run 15 5 normal curl --disable --globoff --noproxy '*' -sS -m 10 -o /dev/null -w '%{http_code}' "http://$host:3003/"
                rc=$?; printf '\037'; exit "$rc")
            rc=$?
            code=${code%$'\037'}
            if (( rc )); then
                check dashboard-http "$rc"
            elif [[ ! $code =~ ^[0-9]{3}$ ]]; then
                check dashboard-http query
            elif [[ ! $code =~ ^2 ]]; then
                check dashboard-http "$code"
            fi

            output=$(run 60 5 normal /usr/bin/python3 -c "$fs_code" capture-contest 4096 sudo -Hu bts \
                env PYTHONDONTWRITEBYTECODE=1 "$checkout/.venv/bin/bts" deploy-canary --config /home/bts/.bts-orchestrator.toml)
            rc=$?
            if [[ -n $output ]]; then
                log "$output"
            elif (( rc == 0 )); then
                rc=query
            fi
            check contest-state "$rc"
            [[ -z $reported ]] || contain "$reported" "$first_status"

            staged=$(as_bts 10 mutation /usr/bin/python3 -c "$fs_code" stage "$checkout/data")
            step_status stamp-stage "$?"
            [[ $staged == "$checkout/data/.deploy."* ]] || contain stamp-stage query
            as_user 20 mutation enable bts-scheduler >/dev/null
            step_status enable "$?"
            enabled enabled 20 as_user
            step_status enable "$?"
            as_bts 10 mutation /usr/bin/python3 -c "$fs_code" stamp "$staged" "$checkout/data/.last_deploy_iso" >/dev/null
            step_status stamp "$?"
            staged=
            publication=committing
            publish committed - - - -
            step_status commit-record "$?"
            publication=committed
            trap '' HUP INT TERM PIPE
            exec 9>&-
            log '================================' "Deployed ${TARGET_SHA:0:7}" "CANARY PASSED — ${TARGET_SHA:0:7} passed the deploy checks" '================================'
            exit 0
            BTS_DEPLOY

      - name: Recover failed deploy via SSH
        if: ${{ always() && (steps.deploy.outcome == 'failure' || steps.deploy.outcome == 'cancelled') }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        env:
          TARGET_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: TARGET_SHA,RUN_ID,RUN_ATTEMPT
          command_timeout: 35m
          script: |
            exec /bin/bash -s <<'BTS_DEPLOY'
            set +e
            exec 8>&1
            export LC_ALL=C
            checkout=/home/bts/projects/bts
            lock_dir=/run/bts-deploy
            attempt=$lock_dir/attempt
            scheduler=bts-scheduler.service
            dashboard=bts-dashboard.service
            legacy_dir=/etc/systemd/system
            old=unknown
            staged=
            budget_start=
            reported=
            phase_steps='commit-record|disable|reset|sync|legacy-units|restart|head|wait|scheduler-state|dashboard-state|dashboard-http|contest-state|stamp-stage|enable|stamp|interrupted|deploy-step-incomplete'

            # Test injection points are the fixed checkout, bts home, runtime and legacy
            # directories, cgroup root, null device, and fixed executable paths at use.
            fs_code='
            import datetime, json, os, pathlib, signal, stat, subprocess, sys, tempfile, time
            from urllib.parse import urlsplit

            op, *args = sys.argv[1:]
            def bounded(path, limit, nofollow=True):
                flags = os.O_RDONLY | os.O_NONBLOCK
                if nofollow:
                    flags |= os.O_NOFOLLOW
                fd = os.open(path, flags)
                with os.fdopen(fd, "rb") as f:
                    metadata = os.fstat(f.fileno())
                    if not stat.S_ISREG(metadata.st_mode):
                        raise ValueError()
                    data = f.read(limit + 1)
                    if len(data) > limit or not os.path.samestat(metadata, os.stat(path, follow_symlinks=False)):
                        raise ValueError()
                    return data, metadata

            def atomic(path, data):
                fd, temporary = tempfile.mkstemp(dir=os.path.dirname(path))
                try:
                    with os.fdopen(fd, "wb") as f:
                        f.write(data)
                    os.replace(temporary, path)
                finally:
                    if os.path.lexists(temporary):
                        os.unlink(temporary)

            try:
                if op == "clock":
                    print(time.monotonic_ns() // 1_000_000)
                elif op == "supervise":
                    term, grace, *command = args
                    # This process retains the inherited lock while the command runs.
                    for sig in (signal.SIGHUP, signal.SIGINT, signal.SIGTERM, signal.SIGPIPE):
                        signal.signal(sig, lambda *_: None)
                    child = subprocess.Popen(["timeout", "-k", grace, term, *command],
                                             start_new_session=True, close_fds=True)
                    try:
                        status = child.wait(timeout=float(term) + float(grace))
                    except subprocess.TimeoutExpired:
                        status = 124
                    if status in (124, 137) or status < 0:
                        try:
                            os.killpg(child.pid, signal.SIGKILL)
                        except ProcessLookupError:
                            pass
                    if child.poll() is None:
                        try:
                            child.wait(timeout=0.1)
                        except subprocess.TimeoutExpired:
                            pass
                    sys.exit(128 - status if status < 0 else status)
                elif op in ("capture", "capture-contest"):
                    limit, *command = args
                    with subprocess.Popen(command, stdout=subprocess.PIPE) as child:
                        data = child.stdout.read(int(limit) + 1)
                        if len(data) > int(limit):
                            child.kill()
                            sys.exit(125)
                        status = child.wait()
                    if op == "capture":
                        sys.stdout.buffer.write(data)
                    else:
                        line = data.removesuffix(b"\n")
                        prefixes = {
                            0: (b"Deploy canary: live contest state accepted (",
                                b"Deploy canary: not a live configuration (delivery "),
                            1: ("Deploy canary: REFUSED — ".encode(),),
                            2: ("Deploy canary: ERROR — ".encode(),),
                        }
                        if not any(byte in line for byte in (b"\0", b"\n", b"\r")) and line.startswith(prefixes.get(status, ())):
                            text = line.decode("utf-8", errors="backslashreplace")
                            print("".join(c if c.isprintable() else ascii(c)[1:-1] for c in text)[:900])
                    sys.exit(128 - status if status < 0 else status)
                elif op == "lockfile":
                    p, = args
                    fd = os.open(p, os.O_WRONLY | os.O_APPEND | os.O_CREAT | os.O_NOFOLLOW | os.O_NONBLOCK, 0o600)
                    with os.fdopen(fd, "ab") as f:
                        s = os.fstat(f.fileno())
                        if not stat.S_ISREG(s.st_mode) or s.st_uid != 0 or stat.S_IMODE(s.st_mode) != 0o600:
                            raise ValueError()
                elif op == "read":
                    p, = args
                    data, _ = bounded(p, 512)
                    if not data.endswith(b"\n") or any(c < 32 or c > 126 for c in data[:-1]):
                        raise ValueError()
                    print(data[:-1].decode("ascii"))
                elif op == "mark":
                    p, = args
                    try:
                        fd = os.open(p, os.O_CREAT | os.O_EXCL | os.O_WRONLY | os.O_NOFOLLOW, 0o600)
                    except FileExistsError:
                        pass
                    else:
                        os.close(fd)
                    data, s = bounded(p, 0)
                    if s.st_uid != 0 or stat.S_IMODE(s.st_mode) != 0o600:
                        raise ValueError()
                elif op == "stage-record":
                    directory, line = args
                    fd, name = tempfile.mkstemp(dir=directory, prefix=".attempt.")
                    try:
                        with os.fdopen(fd, "wb") as f:
                            f.write(line.encode("ascii") + b"\n")
                    except BaseException:
                        os.unlink(name)
                        raise
                    print(name)
                elif op == "stage":
                    directory, = args
                    with tempfile.NamedTemporaryFile(dir=directory, prefix=".deploy.", delete=False) as f:
                        try:
                            f.write(datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ\n").encode("ascii"))
                            f.flush()
                            os.fsync(f.fileno())
                        except BaseException:
                            os.unlink(f.name)
                            raise
                    print(f.name)
                elif op == "stamp":
                    source, path = args
                    if os.path.isdir(path):
                        raise ValueError()
                    os.replace(source, path)
                    fd = os.open(os.path.dirname(path), os.O_RDONLY | os.O_DIRECTORY)
                    try:
                        os.fsync(fd)
                    finally:
                        os.close(fd)
                elif op == "marker":
                    path, step, target, old = args
                    data = json.dumps(dict(state="deploy_failed", timestamp=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                                           step=step, target_sha=target, old_sha=old)).encode()
                    atomic(path, data)
                    if bounded(path, 4096)[0] != data:
                        raise ValueError()
                elif op == "endpoint":
                    path, = args
                    prefix = "BTS_SCHEDULER_HEARTBEAT_PING_URL="
                    lines = bounded(path, 65536)[0].decode().split("\n")
                    value, = [line[len(prefix):] for line in lines if line.startswith(prefix)]
                    if len(value) >= 2 and value[0] in (chr(34), chr(39)) and value[-1] == value[0]:
                        value = value[1:-1]
                    if any(c.isspace() or not c.isprintable() or c in (chr(34), chr(39), "\\", "?", "#", "{", "}", "[", "]") for c in value):
                        raise ValueError()
                    parsed = urlsplit(value)
                    if parsed.scheme != "https" or not parsed.hostname or parsed.username is not None or parsed.password is not None:
                        raise ValueError()
                    if parsed.netloc.endswith(":"):
                        raise ValueError()
                    # A dot segment or an escape could make the request reach another check.
                    if "%" in value or any(part in (".", "..") for part in parsed.path.split("/")):
                        raise ValueError()
                    parsed.port
                    print(value.rstrip("/") + "/fail")
                elif op == "cgroup":
                    root, group = args
                    if not os.path.isfile(os.path.join(root, "cgroup.controllers")):
                        raise ValueError()
                    if group:
                        if not group.startswith("/") or ".." in pathlib.PurePosixPath(group).parts:
                            raise ValueError()
                        path = root + group
                        try:
                            events, _ = bounded(os.path.join(path, "cgroup.events"), 4096)
                        except FileNotFoundError:
                            if os.path.lexists(path):
                                raise
                        else:
                            if [line for line in events.splitlines() if line.startswith(b"populated ")] != [b"populated 0"]:
                                raise ValueError()
            except FileNotFoundError:
                sys.exit(3 if op == "read" and not os.path.lexists(args[0]) else 1)
            except Exception:
                sys.exit(1)
            '

            clock() {
                (exec 9>&- 8>&-; timeout -k 5 1 /usr/bin/python3 -c "$fs_code" clock) 2>/dev/null
            }
            start_phase() {
                local now
                now=$(clock)
                [[ $now =~ ^[0-9]+$ ]] || return 1
                deadline=$((now + $1 * 1000))
            }
            run() {
                local cap=$1 grace=$2 mode=$3 now available term
                shift 3
                if [[ -n ${budget_start:-} ]]; then
                    now=$((budget_origin + (SECONDS - budget_start) * 1000))
                else
                    now=$(clock)
                    [[ $now =~ ^[0-9]+$ ]] || return 124
                fi
                available=$(((deadline - now) / 1000))
                # Bash SECONDS counts whole seconds: allow one for rounding.
                [[ -z ${budget_start:-} ]] || available=$((available - 1))
                if [[ $mode == wait ]] && (( available < cap )); then
                    return 124
                fi
                (( available < cap )) && cap=$available
                term=$((cap - grace))
                (( term > 0 )) || return 124
                case $mode in
                    mutation)
                        /usr/bin/python3 -c "$fs_code" supervise "$term" "$grace" "$@" ;;
                    lock)
                        (exec 8>&-; timeout -k "$grace" "$term" "$@") ;;
                    *)
                        (exec 9>&- 8>&-; timeout -k "$grace" "$term" "$@") ;;
                esac </dev/null 2>/dev/null
            }
            log() {
                (exec 9>&- 8>&-; timeout -k 5 1 /bin/bash -c 'printf "%s\n" "$@"' _ "$@") >&8 2>/dev/null || :
            }
            fs() {
                local cap=$1 mode=$2
                shift 2
                run "$cap" 5 "$mode" /usr/bin/python3 -c "$fs_code" "$@"
            }
            as_user() {
                local cap=$1 mode=$2
                shift 2
                if [[ $uid =~ ^[0-9]+$ ]]; then
                    run "$cap" 5 "$mode" sudo -u bts "XDG_RUNTIME_DIR=/run/user/$uid" systemctl --user "$@"
                else
                    run "$cap" 5 "$mode" sudo -u bts systemctl --user "$@"
                fi
            }
            as_bts() {
                local cap=$1 mode=$2
                shift 2
                run "$cap" 5 "$mode" sudo -Hu bts "$@"
            }
            valid_inputs() {
                [[ $TARGET_SHA =~ ^[0-9a-f]{40}$ ]] || return 1
                [[ $RUN_ID =~ ^[0-9]{1,20}$ && $RUN_ATTEMPT =~ ^[0-9]{1,20}$ &&
                   $RUN_ID =~ [1-9] && $RUN_ATTEMPT =~ [1-9] ]] || return 2
            }
            lock() {
                local metadata
                [[ ! -L $lock_dir ]] || return 1
                if [[ ! -e $lock_dir ]]; then
                    run 10 5 normal install -d -m 0700 -o root -g root "$lock_dir" >/dev/null || return 1
                fi
                [[ -d $lock_dir && ! -L $lock_dir && ! -L $lock_dir/lock ]] || return 1
                metadata=$(run 10 5 normal stat -c '%u %a' "$lock_dir") || return 1
                [[ $metadata == '0 700' ]] || return 1
                [[ ! -e $lock_dir/lock || -f $lock_dir/lock ]] || return 1
                fs 10 normal lockfile "$lock_dir/lock" || return 1
                { exec 9>>"$lock_dir/lock"; } 2>/dev/null || return 1
                if [[ $1 == deploy ]]; then
                    run 10 5 lock flock -n 9
                else
                    run 1505 5 lock flock -w 1500 9
                fi
            }
            read_record() {
                local record cap=${1:-10}
                record=$(fs "$cap" normal read "$attempt")
                local rc=$?
                (( rc == 0 )) || return "$rc"
                local grammar="^bts_deploy_attempt_v1 ([0-9]{1,20}) ([0-9]{1,20}) ([0-9a-f]{40}) ([0-9a-f]{40}) (begun|committed|contained) ([a-z-]+) (-|verified|unverified) (-|verified|unverified) (-|verified|unverified)$"
                [[ $record =~ $grammar ]] || return 1
                r_run=${BASH_REMATCH[1]} r_try=${BASH_REMATCH[2]} r_target=${BASH_REMATCH[3]} r_old=${BASH_REMATCH[4]}
                r_state=${BASH_REMATCH[5]} r_step=${BASH_REMATCH[6]}
                r_stop=${BASH_REMATCH[7]} r_marker=${BASH_REMATCH[8]} r_page=${BASH_REMATCH[9]}
                [[ $r_run =~ [1-9] && $r_try =~ [1-9] ]] || return 1
                if [[ $r_state == contained ]]; then
                    [[ $r_step =~ ^($phase_steps)$ && $r_stop != - && $r_marker != - && $r_page != - ]]
                else
                    [[ $r_step == - && $r_stop$r_marker$r_page == --- ]]
                fi
            }
            same_ids() { [[ $r_run == "$RUN_ID" && $r_try == "$RUN_ATTEMPT" ]]; }
            same_record() { same_ids && [[ $r_target == "$TARGET_SHA" && $r_old == "$old" ]]; }
            publish() {
                local wanted=$1 staged_record status rc
                shift
                staged_record=$(fs 10 mutation stage-record "$lock_dir" "bts_deploy_attempt_v1 $RUN_ID $RUN_ATTEMPT $TARGET_SHA $old $wanted $*")
                status=$?
                if (( status == 0 )); then
                    if [[ $staged_record == "$lock_dir/.attempt."* ]]; then
                        run 10 5 mutation mv -fT "$staged_record" "$attempt" >/dev/null
                        status=$?
                        if [[ -e $staged_record ]]; then
                            run 10 5 mutation rm -f -- "$staged_record" >/dev/null || :
                        fi
                    else
                        status=1
                    fi
                fi
                read_record
                rc=$?
                if (( rc == 0 )) && same_record && [[ $r_state == "$wanted" && "$r_step $r_stop $r_marker $r_page" == "$*" ]]; then
                    return 0
                fi
                if [[ $wanted == committed ]]; then
                    case $status:$rc in
                        124:*|137:*|*:124|*:137) return 124 ;;
                    esac
                    (( status == 0 )) || return "$status"
                    # A failed read-back after a successful rename keeps its own status.
                    (( rc == 0 || rc == 3 )) || return "$rc"
                fi
                if (( rc != 0 && rc != 3 )); then
                    return 2
                fi
                return 1
            }
            field() {
                local key=$1 contents=$2 allow_empty=${3:-no} line result= count=0
                while IFS= read -r line; do
                    if [[ $line == "$key="* ]]; then
                        result=${line#*=}
                        (( count += 1 ))
                    fi
                done <<< "$contents"
                [[ $count == 1 && ( -n $result || $allow_empty == yes ) ]] || return 1
                printf '%s' "$result"
            }
            enabled() {
                local expected=$1 cap=$2 output rc
                shift 2
                output=$("$@" "$cap" normal is-enabled "$unit"; rc=$?; printf '\037'; exit "$rc")
                rc=$?
                [[ $rc != 124 && $rc != 137 ]] || return "$rc"
                if [[ $expected == disabled ]]; then
                    [[ $rc == 1 && $output == $'disabled\n\037' ]]
                else
                    [[ $rc == 0 && $output == $'enabled\n\037' ]]
                fi
            }
            system_unit() {
                local cap=$1 mode=$2
                shift 2
                run "$cap" 5 "$mode" systemctl "$@"
            }
            jobs_clear() {
                local command=$1 cap=$2 name=$3 jobs job id rest
                jobs=$("$command" "$cap" normal list-jobs --no-legend --no-pager) || return 1
                while read -r id job rest; do
                    [[ -z $id || ( $id =~ ^[0-9]+$ && -n $job && -n $rest && $job != "$name" ) ]] || return 1
                done <<< "$jobs"
            }
            legacy_state() {
                local cap=$1 name=$2 output id active pid
                output=$(system_unit "$cap" normal show "$name" -p Id -p LoadState -p ActiveState -p MainPID) || return 1
                id=$(field Id "$output") && [[ $id == "$name" ]] || return 1
                active=$(field ActiveState "$output") || return 1
                pid=$(field MainPID "$output") && [[ $pid =~ ^[0-9]+$ ]] || return 1
                legacy=$(field LoadState "$output") || return 1
                case $active in active|inactive|failed|activating|deactivating|reloading) ;; *) return 1 ;; esac
                case $legacy in
                    loaded) ;;
                    not-found) [[ $active == inactive && $pid == 0 ]] || return 1 ;;
                    *) return 1 ;;
                esac
                jobs_clear system_unit "$cap" "$name"
            }
            no_fragment() { [[ ! -e $legacy_dir/$scheduler && ! -L $legacy_dir/$scheduler ]]; }
            # Phase 2 marks an attempt before it stops and unloads a loaded legacy scheduler. After that
            # its absence proves nothing about the cgroup it left, so no containment of the attempt accepts it.
            legacy_cleaned() { [[ -e $lock_dir/legacy.$RUN_ID.$RUN_ATTEMPT || -L $lock_dir/legacy.$RUN_ID.$RUN_ATTEMPT ]]; }
            scheduler_group() {
                local output
                output=$("$1" 10 normal show "$2" -p ControlGroup) || return 1
                # A successful blank value is an observation; only a failed query returns non-zero.
                field ControlGroup "$output" yes
            }
            check_stopped() {
                local command=$1 name=$2 previous_group=$3 output active pid group
                output=$("$command" 20 normal show "$name" -p ActiveState -p MainPID -p ControlGroup) || return 1
                active=$(field ActiveState "$output") && [[ $active == inactive || $active == failed ]] || return 1
                pid=$(field MainPID "$output") && [[ $pid == 0 ]] || return 1
                group=$(field ControlGroup "$output" yes) || return 1
                jobs_clear "$command" 20 "$scheduler" || return 1
                [[ -n $previous_group || -n $group ]] || return 1
                if [[ -n $previous_group && $previous_group != "$group" ]]; then
                    fs 20 normal cgroup /sys/fs/cgroup "$previous_group" || return 1
                fi
                [[ -z $group ]] || fs 20 normal cgroup /sys/fs/cgroup "$group"
            }
            # The one proof function (D3 amendment 4, M1): the only code that makes a
            # result "verified" and the only printer of the containment results. Each
            # result starts unverified and becomes verified only from an observation
            # made by this containment (the page also from this attempt's own record).
            prove() {
                case $1 in
                    stop)
                        local user_proof=1 system_proof=1 residual legacy_ok=1 post_group
                        stop=unverified
                        # Proof queries: to 205 s of the handler's 280 s.
                        deadline=$((containment_deadline - 75000))
                        if (( uid_status == 0 && user_group_status == 0 )) && [[ $uid =~ ^[0-9]+$ ]]; then
                            unit=bts-scheduler
                            if enabled disabled 20 as_user && check_stopped as_user "$unit" "$user_group"; then
                                user_proof=0
                            fi
                        fi
                        if legacy_state 20 "$scheduler"; then
                            unit=$scheduler
                            if [[ $legacy == not-found ]] && no_fragment; then
                                if ! legacy_cleaned && post_group=$(scheduler_group system_unit "$scheduler"); then
                                    if [[ $legacy_absent == 0 ]]; then
                                        # Absent at the containment's first sample: no path needed, any reported one checked.
                                        system_proof=0
                                    elif (( legacy_group_status == 0 )) && [[ -n $legacy_group || -n $post_group ]]; then
                                        # Seen loaded, or not seen absent: at least one path known.
                                        system_proof=0
                                    fi
                                    # Every known path must be empty or absent.
                                    [[ -z $legacy_group ]] || fs 20 normal cgroup /sys/fs/cgroup "$legacy_group" || system_proof=1
                                    [[ -z $post_group || $post_group == "$legacy_group" ]] ||
                                        fs 20 normal cgroup /sys/fs/cgroup "$post_group" || system_proof=1
                                fi
                            elif [[ $legacy == loaded ]] && (( legacy_group_status == 0 )) &&
                                 check_stopped system_unit "$scheduler" "$legacy_group" && enabled disabled 20 system_unit; then
                                system_proof=0
                            fi
                        fi
                        if (( system_proof == 0 )) && [[ $legacy_absent == 0 || $legacy_disabled$legacy_stopped == 00 ]]; then
                            legacy_ok=0
                        fi
                        # The residual check's own window, 205 to 220 s: no proof query above runs past 205 s,
                        # and it is launched whatever the proof found.
                        deadline=$((containment_deadline - 60000))
                        run 20 5 normal pgrep -u bts -f 'bts schedule' >/dev/null; residual=$?
                        if [[ $user_disabled$user_stopped$user_proof$legacy_ok$residual == 00001 ]]; then
                            stop=verified
                        fi
                        ;;
                    marker)
                        marker=unverified
                        [[ $2 == 0 ]] && marker=verified
                        ;;
                    page)
                        page=unverified
                        if [[ $2 == carried ]] || [[ $2 == 0 && $3 =~ ^2[0-9][0-9]$ ]]; then
                            page=verified
                        fi
                        ;;
                    report)
                        # One bounded print with a short grace: the last two seconds of the handler.
                        local lines=("Scheduler stopped: $stop." "Failure heartbeat written: $marker."
                                     "Failure ping received HTTP 2xx: $page." "Recovery procedure: INCIDENT.md §4.")
                        if [[ $repeat == yes && $stop$marker$page == verifiedverifiedverified ]]; then
                            lines+=('DEPLOY RECOVERY — containment re-checked.')
                        fi
                        (exec 9>&- 8>&-; timeout -k 1 1 /bin/bash -c 'printf "%s\n" "$@"' _ "${lines[@]}") >&8 2>/dev/null || :
                        ;;
                esac
            }
            contain() {
                trap '' HUP INT TERM PIPE
                local step=$1 status=$2 prior_page=$3 repeat=$4
                local stop=unverified marker=unverified page=unverified uid unit
                local user_disabled=1 user_stopped=1 legacy_disabled=1 legacy_stopped=1 legacy_absent=1
                local deadline containment_deadline output endpoint user_group legacy_group= post_status
                local user_group_status=1 legacy_group_status=1 legacy_first=1
                local budget_start=$SECONDS budget_origin
                # One sample anchors the handler's separate budget. Bash SECONDS also
                # keeps that budget running when the external clock cannot be sampled.
                budget_origin=$(clock)
                [[ $budget_origin =~ ^[0-9]+$ ]] || budget_origin=0
                containment_deadline=$((budget_origin + 280000))
                if [[ $repeat != yes ]]; then
                    log "DEPLOY FAILED at $step — requested target ${TARGET_SHA:0:7}, previous SHA ${old:0:7}. No automatic rollback was attempted. Recovery has not been verified."
                    [[ $reported == "$step" ]] || log "Check $step failed ($status)."
                fi
                # User scope stop: to 90 s.
                deadline=$((containment_deadline - 190000))
                uid=$(run 10 5 normal id -u bts)
                local uid_status=$?
                if (( uid_status != 0 )) || [[ ! $uid =~ ^[0-9]+$ ]]; then
                    uid=
                fi
                user_group=$(scheduler_group as_user bts-scheduler); user_group_status=$?
                as_user 10 mutation disable bts-scheduler >/dev/null; user_disabled=$?
                as_user 60 mutation stop bts-scheduler >/dev/null; user_stopped=$?
                # Legacy scope stop: to 180 s.
                deadline=$((containment_deadline - 100000))
                legacy_state 10 "$scheduler"; legacy_first=$?
                legacy_group=$(scheduler_group system_unit "$scheduler"); legacy_group_status=$?
                if (( legacy_first == 0 && legacy_group_status == 0 )) && [[ $legacy == not-found && -z $legacy_group ]] &&
                   no_fragment && ! legacy_cleaned; then
                    # Absent: not-found, inactive, PID 0, no jobs, no cgroup and no fragment entry.
                    legacy_absent=0
                else
                    system_unit 10 mutation disable "$scheduler" >/dev/null; legacy_disabled=$?
                    system_unit 60 mutation stop "$scheduler" >/dev/null; legacy_stopped=$?
                fi
                prove stop
                # Marker: to 240 s, before the optional staged-file cleanup.
                deadline=$((containment_deadline - 40000))
                as_bts 20 mutation /usr/bin/python3 -c "$fs_code" marker "$checkout/data/.heartbeat" "$step" "${TARGET_SHA:0:7}" "${old:0:7}" >/dev/null
                prove marker "$?"
                if [[ $staged == "$checkout/data/.deploy."* ]]; then
                    as_bts 10 mutation rm -f -- "$staged" >/dev/null || :
                fi
                # Endpoint parsing to 254 s, so a valid URL leaves curl at least 10 s of TERM before 270 s.
                deadline=$((containment_deadline - 26000))
                if [[ $prior_page == verified ]]; then
                    prove page carried
                elif endpoint=$(as_bts 20 normal /usr/bin/python3 -c "$fs_code" endpoint "$checkout/.env"); then
                    deadline=$((containment_deadline - 10000))
                    output=$(run 20 5 normal curl --disable --globoff --path-as-is --noproxy '*' -sS -m 10 -o /dev/null -w '%{http_code}' \
                        --data-raw "Deploy failed at $step, requested target ${TARGET_SHA:0:7}, scheduler stop $stop. See INCIDENT.md §4." "$endpoint"
                        local status=$?; printf '\037'; exit "$status")
                    post_status=$?
                    prove page "$post_status" "${output%$'\037'}"
                else
                    prove page none
                fi
                # The record to 278 s; the last two seconds are for the result lines.
                deadline=$((containment_deadline - 2000))
                publish contained "$step" "$stop" "$marker" "$page" || :
                exec 9>&-
                prove report
                exit 1
            }

            recovery_exit() {
                exec 9>&-
                log "$1"
                exit 1
            }
            valid_inputs || recovery_exit 'DEPLOY RECOVERY — invalid attempt inputs. Recovery has not been verified. See INCIDENT.md §4.'
            start_phase 1580 && cd "$checkout" 2>/dev/null && lock recovery ||
                recovery_exit 'DEPLOY RECOVERY — lock unavailable. Recovery has not been verified. See INCIDENT.md §4.'
            read_record
            rc=$?
            unreadable='DEPLOY RECOVERY — the attempt record is unreadable. Recovery has not been verified. See INCIDENT.md §4.'
            case $rc in
                0) if same_ids && [[ $r_target != "$TARGET_SHA" ]]; then recovery_exit "$unreadable"; fi ;;
                3) ;;
                *) recovery_exit "$unreadable" ;;
            esac
            if (( rc == 3 )) || ! same_ids; then
                fs 10 mutation mark "$lock_dir/cancelled.$RUN_ID.$RUN_ATTEMPT" ||
                    recovery_exit 'DEPLOY RECOVERY — cancellation mark could not be verified. No service change was attempted. See INCIDENT.md §4.'
                if (( rc == 3 )); then
                    recovery_exit 'DEPLOY RECOVERY — no phase-2 record is present. Check the deploy log and the host'\''s boot time.'
                fi
                recovery_exit 'DEPLOY RECOVERY — a different attempt owns the box record. See INCIDENT.md §4.'
            fi
            old=$r_old
            case $r_state in
                committed) recovery_exit 'DEPLOY RECOVERY — this attempt'\''s record says committed. Check the deploy log and verify current state via INCIDENT.md §4.' ;;
                begun) contain deploy-step-incomplete 1 ;;
                contained) contain "$r_step" 1 "$r_page" yes ;;
            esac
            exit 1
            BTS_DEPLOY
