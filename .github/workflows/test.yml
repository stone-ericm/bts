name: tests

# Runs the (fast) test suite on every push to main and on pull requests.
# Mirrors the production install path (uv sync --locked --extra model) so the
# lightgbm/model-dependent tests actually execute — on Linux the lightgbm
# manylinux wheel works without the libomp dance Macs need. The deploy workflow
# (deploy.yml) is separate; gating it on this is a follow-up (see audit T1).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The box + Mac that generate uv.lock are America/New_York; the date-only
      # exclude-newer is resolved in local time, so a UTC runner shifts it and
      # `--locked` rejects the lockfile. Run CI in ET to match (also aligns the
      # few host-clock-coupled tests with production). (see uv pin below)
      TZ: America/New_York
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false  # no later step needs the git token (review #8)

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          # Pin to the production box's uv so `--locked` interprets the
          # exclude-newer timestamp identically (newer uv shifted it 04:00Z->00:00Z
          # and rejected the lockfile). Bump alongside the box + uv.lock.
          version: "0.11.6"
          enable-cache: true

      - name: Install dependencies (locked, incl. model extra)
        run: uv sync --locked --extra model

      - name: Run test suite (excluding slow walk-forward tests)
        run: uv run pytest -m "not slow"
