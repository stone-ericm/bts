# ONE-SHOT (2026-07-10): install the new deploy pubkey on root@bts-mlb using
# the OLD repo-level HETZNER_SSH_KEY, as part of rotating that key into a
# protected `production` environment. Same pattern as the 2026-06-06
# PasswordAuthentication hardening. DELETE THIS FILE after the rotation.
name: One-shot rotate root deploy key

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  install-new-pubkey:
    runs-on: ubuntu-latest
    steps:
      - name: Append new deploy pubkey to root authorized_keys
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            NEW_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII5oy+1Af9kabX8/Lq8rsXcF8V/hjHR17+p8yI+SUjIY bts-deploy-2026-07-10"
            touch /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
            if grep -qF "$NEW_KEY" /root/.ssh/authorized_keys; then
              echo "new key already present"
            else
              printf '%s\n' "$NEW_KEY" >> /root/.ssh/authorized_keys
              echo "new key appended"
            fi
            echo "authorized_keys now holds (comments only):"
            awk '{print NR": "$NF}' /root/.ssh/authorized_keys
